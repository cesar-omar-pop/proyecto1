<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2196f3">
  <title>PWA - App Shell</title>

  <!-- Web App Manifest y Estilos -->
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <!-- App Shell: Header -->
  <header class="app-header">
    <h1>Mi PWA App</h1>
  </header>

  <!-- App Shell: Navegación -->
  <nav class="app-nav">
    <a href="#inicio" class="active">Inicio</a>
    <a href="#servicios">Servicios</a>
    <a href="#contacto">Contacto</a>
  </nav>

  <!-- Contenido principal y visualización de iconos -->
  <main class="app-content">
    <h2>Bienvenido a la PWA</h2>
    <p>Visualización directa de las imágenes del proyecto:</p>

    <div style="display: flex; gap: 20px; align-items: center; margin-top: 20px;">
      <div>
        <p><strong>Icono 192x192:</strong></p>
        <img src="./icons/icon-192x192.png" alt="Icono 192" width="100">
      </div>
      <div>
        <p><strong>Icono 512x512:</strong></p>
        <img src="./icons/icon-512x512.png" alt="Icono 512" width="100">
      </div>
    </div>
  </main>

</body>
</html>
